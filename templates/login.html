<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Masuk Ujian Siswa | SMK Budi Murni 2</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Outfit', sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 50%, #0f172a 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            color: #f8fafc;
        }
        .container {
            width: 100%;
            max-width: 450px;
            perspective: 1000px;
        }
        .card {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 24px;
            padding: 40px 30px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }
        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 30px 50px rgba(0, 0, 0, 0.5);
        }
        .logo-container {
            text-align: center;
            margin-bottom: 25px;
        }
        .school-logo {
            width: 110px;
            height: 110px;
            object-fit: cover;
            border-radius: 50%;
            border: 4px solid rgba(59, 130, 246, 0.3);
            box-shadow: 0 8px 24px rgba(59, 130, 246, 0.2);
            transition: transform 0.5s ease;
        }
        .school-logo:hover {
            transform: rotate(360deg);
        }
        h2 {
            text-align: center;
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 5px;
            color: #ffffff;
            letter-spacing: 0.5px;
        }
        .subtitle {
            text-align: center;
            font-size: 14px;
            color: #94a3b8;
            margin-bottom: 30px;
            font-weight: 400;
        }
        .alert {
            background: rgba(239, 68, 68, 0.15);
            border: 1px solid rgba(239, 68, 68, 0.3);
            color: #fca5a5;
            padding: 12px 16px;
            border-radius: 12px;
            font-size: 14px;
            margin-bottom: 20px;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .form-group {
            position: relative;
            margin-bottom: 20px;
        }
        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-size: 13px;
            font-weight: 500;
            color: #94a3b8;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        input, select {
            width: 100%;
            padding: 14px 16px;
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 14px;
            outline: none;
            color: #ffffff;
            font-size: 15px;
            font-family: inherit;
            transition: all 0.3s ease;
        }
        input::placeholder {
            color: #64748b;
        }
        input:focus, select:focus {
            border-color: #3b82f6;
            box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.15);
            background: rgba(15, 23, 42, 0.8);
        }
        select option {
            background: #1e293b;
            color: #ffffff;
            padding: 10px;
        }
        .token-input {
            letter-spacing: 2px;
            text-align: center;
            font-weight: 600;
            text-transform: uppercase;
        }
        .btn-submit {
            width: 100%;
            padding: 14px;
            background: linear-gradient(90deg, #2563eb, #1d4ed8);
            border: none;
            border-radius: 14px;
            color: #ffffff;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.3);
            margin-top: 10px;
            transition: all 0.3s ease;
        }
        .btn-submit:hover {
            background: linear-gradient(90deg, #1d4ed8, #1e40af);
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(37, 99, 235, 0.5);
        }
        .btn-submit:active {
            transform: translateY(0);
        }
        .footer {
            margin-top: 30px;
            text-align: center;
            font-size: 12px;
            color: #64748b;
        }
        .footer a {
            color: #3b82f6;
            text-decoration: none;
            font-weight: 500;
        }
        .footer a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="card">
            <div class="logo-container">
                <img src="/smk%20budi%20murni%202.jpg" alt="Logo SMK Budi Murni 2" class="school-logo">
            </div>
            <h2>E-Ujian SMK BM 2</h2>
            <div class="subtitle">Platform Evaluasi Belajar Siswa Mandiri & Aman</div>
            
            {% if error or request.args.get('error') %}
            <div class="alert">
                <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/>
                </svg>
                <span>{{ error or request.args.get('error') }}</span>
            </div>
            {% endif %}
            
            <form action="{{ url_for('login') }}" method="POST">
                <div class="form-group">
                    <label for="nama">Nama Lengkap</label>
                    <input type="text" id="nama" name="nama" placeholder="Nama Lengkap Sesuai Absen" required autocomplete="off">
                </div>
                
                <div class="form-group">
                    <label for="kelas">Kelas</label>
                    <select id="kelas" name="kelas" required onchange="updateMateriOptions()">
                        <option value="" disabled selected>-- Pilih Kelas --</option>
                        <option value="X">Kelas X</option>
                        <option value="XI">Kelas XI</option>
                        <option value="XII">Kelas XII</option>
                    </select>
                </div>
                
                <div class="form-group">
                    <label for="materi">Materi Ujian</label>
                    <select id="materi" name="materi" required>
                        <option value="" disabled selected>-- Pilih Kelas Terlebih Dahulu --</option>
                    </select>
                </div>
                
                <div class="form-group">
                    <label for="jurusan">Jurusan</label>
                    <select id="jurusan" name="jurusan" required onchange="updateMateriOptions()">
                        <option value="" disabled selected>-- Pilih Jurusan --</option>
                        <option value="DKV 1">DKV 1</option>
                        <option value="DKV 2">DKV 2</option>
                        <option value="TKJ 1">TKJ 1</option>
                        <option value="TKJ 2">TKJ 2</option>
                        <option value="AK 1">AK 1</option>
                        <option value="AK 2">AK 2</option>
                        <option value="BR 1">BR 1</option>
                        <option value="BR 2">BR 2</option>
                        <option value="MP 1">MP 1</option>
                        <option value="MP 2">MP 2</option>
                    </select>
                </div>
                
                
                <button type="submit" class="btn-submit">Lanjut ke Konfirmasi Ujian</button>
            </form>
            
            <div class="footer">
                Proktor / Pengawas? <a href="{{ url_for('proctor_login') }}">Masuk Dashboard</a>
            </div>
        </div>
    </div>

    <script>
        function updateMateriOptions() {
            const kelasVal = document.getElementById('kelas').value;
            const jurusanVal = document.getElementById('jurusan').value;
            const materiSelect = document.getElementById('materi');
            if (!kelasVal) return;
            
            materiSelect.innerHTML = '<option value="" disabled selected>Memuat materi...</option>';
            
            let url = '/api/materis/' + encodeURIComponent(kelasVal);
            if (jurusanVal) {
                url += '?jurusan=' + encodeURIComponent(jurusanVal);
            }
            
            fetch(url)
                .then(res => {
                    if (!res.ok) {
                        throw new Error('Network error');
                    }
                    return res.json();
                })
                .then(data => {
                    materiSelect.innerHTML = '';
                    if (data && data.materis && data.materis.length > 0) {
                        data.materis.forEach((m, idx) => {
                            const opt = document.createElement('option');
                            opt.value = m;
                            opt.textContent = m;
                            if (idx === 0) opt.selected = true;
                            materiSelect.appendChild(opt);
                        });
                    } else {
                        const opt = document.createElement('option');
                        opt.value = '';
                        opt.textContent = '-- Tidak Ada Soal Untuk Jurusan Ini --';
                        opt.disabled = true;
                        opt.selected = true;
                        materiSelect.appendChild(opt);
                    }
                })
                .catch(err => {
                    console.error('Error fetching materis:', err);
                    materiSelect.innerHTML = '<option value="" disabled selected>Gagal memuat materi</option>';
                });
        }

        document.addEventListener('DOMContentLoaded', function() {
            const kelasSelect = document.getElementById('kelas');
            if (kelasSelect && kelasSelect.value) {
                updateMateriOptions();
            }
        });
    </script>


</body>
</html>
