<?php
session_start();

if (isset($_POST['token_input'])) {
    $token_input = strtoupper(trim($_POST['token_input']));

    if ($token_input === $_SESSION['token_baru']) {
        $_SESSION['status'] = 'aktif'; 
        $_SESSION['token_baru'] = '';  

        // Hapus file token siswa di folder jika sudah sukses dimasukkan (biar folder tetap bersih) [1]
        $nama_clean = preg_replace('/[^A-Za-z0-9_\-]/', '_', $_SESSION['siswa']);
        $nama_file = "data_token/" . $nama_clean . ".txt";
        if (file_exists($nama_file)) {
            unlink($nama_file); // Perintah hapus file [1]
        }

        header("Location: ujian.php");
    } else {
        echo "<script>alert('Token salah! Silakan periksa kembali atau minta ulang pengawas.'); window.location.href='ujian.php';</script>";
    }
}
?>
