<?php
session_start();

// Simpan data login ke session jika baru masuk
if (isset($_POST['masuk'])) {
    $_SESSION['siswa'] = $_POST['nama'];
    $_SESSION['kelas'] = $_POST['kelas'];
    $_SESSION['jurusan'] = $_POST['jurusan'];
    $_SESSION['status'] = 'aktif'; 
    $_SESSION['token_baru'] = '';
}

// Jika belum login, tendang kembali ke halaman masuk
if (!isset($_SESSION['siswa'])) {
    header("Location: login.php");
    exit();
}
