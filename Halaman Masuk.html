<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Masuk Siswa</title>
    <style>
        body { font-family: Arial, sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; background: #f0f2f5; margin: 0; }
        .login-card { background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); width: 320px; }
        h2 { text-align: center; margin-bottom: 20px; color: #333; }
        input, select { width: 100%; padding: 10px; margin: 8px 0; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; font-size: 14px; }
        button { width: 100%; padding: 10px; background: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 16px; margin-top: 10px; }
        button:hover { background: #0056b3; }
    </style>
</head>
<body>
    <div class="login-card">
        <h2>Masuk Ujian</h2>
        <form action="ujian.php" method="POST">
            <input type="text" name="nama" placeholder="Nama Lengkap Sesuai Absen" required>
            
            <select name="kelas" required>
                <option value="">-- Pilih Kelas --</option>
                <option value="X">Kelas X</option>
                <option value="XI">Kelas XI</option>
                <option value="XII">Kelas XII</option>
            </select>

            <select name="jurusan" required>
                <option value="">-- Pilih Jurusan --</option>
                <option value="DKV 1">DKV 1</option>
                <option value="DKV 2">DKV 2</option>
                <option value="TKJ 1">TKJ 1</option>
                <option value="TKJ 2">TKJ 2</option>
                <option value="AK 1">AK 1</option>
                <option value="AK 2">AK 2</option>
                <option value="BR 1">BR 1</option>
                <option value="BR 2">BR 2</option>
                <option value="MP 1">MP 1</option>
                <option value="MP 2">MP 2</option>
            </select>

            <button type="submit" name="masuk">Mulai Ujian</button>
        </form>
    </div>
</body>
</html>
